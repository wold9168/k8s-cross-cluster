# tailscale-proxy-with-caddy.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: tailscale-proxy
  namespace: default
  labels:
    name: k8s-cross-cluster
spec:
  selector:
    app: tailscale-proxy
  ports:
    - name: http-proxy
      port: 1050  # Tailscale HTTP proxy 默认端口
      targetPort: 1050
    - name: socks5
      port: 1055  # Tailscale SOCKS5 默认端口
      targetPort: 1055
    - name: caddy-http
      port: 80
      targetPort: 80
    - name: caddy-https
      port: 443
      targetPort: 443
    - name: coredns-subdnsserver-tcp
      port: 10053
      targetPort: 10053
      protocol: TCP
    - name: coredns-subdnsserver-udp
      port: 10053
      targetPort: 10053
      protocol: UDP
  type: ClusterIP  # 仅集群内可访问
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-proxy
  namespace: default
  labels:
    name: k8s-cross-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscale-proxy
  template:
    metadata:
      labels:
        app: tailscale-proxy
    spec:
      serviceAccountName: tailscale  # 需要 RBAC
      containers:
        # ===== Tailscale 用户空间代理容器 =====
        - name: tailscale
          image: tailscale/tailscale:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale
                  key: TS_AUTHKEY
            - name: TS_EXTRA_ARGS
              valueFrom:
                configMapKeyRef:
                  name: tailscale-extra-args
                  key: TS_EXTRA_ARGS
            - name: TS_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: tailscale-extra-args
                  key: TS_HOSTNAME
                  optional: true
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_SOCKET
              value: /var/run/tailscale/tailscaled.sock
            - name: TS_USERSPACE
              value: "true"   # 启用用户空间模式
            - name: TS_OUTBOUND_HTTP_PROXY_LISTEN
              value: "0.0.0.0:1050"
            - name: TS_SOCKS5_SERVER
              value: "0.0.0.0:1055"
            - name: TS_ACCEPT_DNS
              value: "true"   # 可选：启用 MagicDNS
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            - name: tailscale-socket
              mountPath: /var/run/tailscale
          # 用户空间模式下无需特权
          securityContext:
            capabilities:
              drop:
                - ALL
        # ===== Caddy 容器 =====
        - name: caddy
          image: caddy:2.8-alpine
          # 提权以绑定特权端口
          securityContext:
            capabilities:
              add:
                - CAP_NET_BIND_SERVICE
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: shared-caddy-config
              mountPath: /etc/caddy
        # ===== CoreDNS Config Manager 容器 =====
        - name: coredns-config-manager
          image: ghcr.io/wold9168/k8s-cross-cluster/coredns-config-manager:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 10053
              name: dns-tcp
              protocol: TCP
            - containerPort: 10053
              name: dns-udp
              protocol: UDP
          volumeMounts:
            - name: tailscale-socket
              mountPath: /run/tailscale
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
        # ===== Caddy Config Manager 容器 =====
        - name: caddy-config-manager
          image: ghcr.io/wold9168/k8s-cross-cluster/caddy-config-manager:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: shared-caddy-config
              mountPath: /config
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
      volumes:
        - name: tailscale-state
          emptyDir: {}
        - name: tailscale-socket
          emptyDir: {}
        - name: shared-caddy-config
          emptyDir: {}

---
# Caddy 的初始配置（空或简单占位）
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: default
  labels:
    name: k8s-cross-cluster
data:
  Caddyfile: |
    # 留空，交给 Sidecar 服务填写
