name: Build and Push Docker Image

on:
  push:
    branches:
      - snapshot
      - refactor-snapshot
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/snapshot || "${{ github.ref }}" == refs/heads/refactor-snapshot ]]; then
            echo "tag=snapshot-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push caddy-config-manager
        run: |
          docker buildx build -f sidecar/caddy-config-manager/Dockerfile \
            --tag ghcr.io/${{ github.repository }}/caddy-config-manager:${{ steps.tag.outputs.tag }} \
            --tag ghcr.io/${{ github.repository }}/caddy-config-manager:latest \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            .

      - name: Build and push coredns-config-manager
        run: |
          docker buildx build -f sidecar/coredns-config-manager/Dockerfile \
            --tag ghcr.io/${{ github.repository }}/coredns-config-manager:${{ steps.tag.outputs.tag }} \
            --tag ghcr.io/${{ github.repository }}/coredns-config-manager:latest \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            .
