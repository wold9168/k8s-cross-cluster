name: Build and Push Docker Image

on:
  push:
    branches:
      - snapshot
      - refactor-snapshot
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/snapshot || "${{ github.ref }}" == refs/heads/refactor-snapshot ]]; then
            echo "tag=snapshot-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build images using Makefile
        run: |
          make sidecar-image-build TAG=${{ steps.tag.outputs.tag }} REPO_NAME=${{ github.repository }}
          make sidecar-image-build TAG=latest REPO_NAME=${{ github.repository }}

      - name: Push images to registry
        run: |
          docker push ghcr.io/${{ github.repository }}/caddy-config-manager:${{ steps.tag.outputs.tag }}
          docker push ghcr.io/${{ github.repository }}/caddy-config-manager:latest
          docker push ghcr.io/${{ github.repository }}/coredns-config-manager:${{ steps.tag.outputs.tag }}
          docker push ghcr.io/${{ github.repository }}/coredns-config-manager:latest
